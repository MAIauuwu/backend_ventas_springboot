name: CI/CD - Ventas Innovatech

on:
  push:
    branches:
      - deploy
  pull_request:
    branches:
      - deploy

jobs:
  # ================================
  # ETAPA 1: BUILD + TEST
  # ================================
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Compilar y ejecutar tests (Maven)
        working-directory: Springboot-API-REST
        run: mvn clean verify -B

      - name: Subir reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-ventas
          path: Springboot-API-REST/target/surefire-reports/
          retention-days: 3

  # ================================
  # ETAPA 2: PUSH (Docker Hub)
  # ================================
  push:
    name: Push Imagen Docker
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST
          file: ./Springboot-API-REST/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ventas-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ventas-backend:${{ github.sha }}

  # ================================
  # ETAPA 3: DEPLOY (EC2 via SSH)
  # ================================
  deploy:
    name: Deploy en EC2 Ventas
    needs: push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deploy'

    steps:
      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PRIVATE_IP_VENTAS }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_HOST }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/back-ventas/Springboot-API-REST
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
